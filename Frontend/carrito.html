<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Carrito - Dulce Hogar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navegación -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">🥐 Dulce Hogar</a>
      <a href="index.html" class="btn btn-outline-primary btn-sm">Volver a la tienda</a>
    </div>
  </nav>

  <main class="container my-5">
    <h2 class="mb-4">Tu Carrito de Compras</h2>
    <div class="row">
      <div class="col-lg-8">
        <!-- Lista de productos en el carrito -->
        <ul id="cart-items-list" class="list-group mb-3">
          <!-- Se llena dinámicamente con JS -->
        </ul>
      </div>
      <div class="col-lg-4">
        <div class="card p-3 shadow-sm">
          <h4>Resumen</h4>
          <hr>
          <div class="d-flex justify-content-between mb-3">
            <span>Total:</span>
            <strong id="cart-total">$0</strong>
          </div>
          <button id="btn-pagar" class="btn btn-success w-100">Proceder al Pago</button>
          <button id="btn-vaciar" class="btn btn-outline-danger w-100 mt-2">Vaciar Carrito</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/carrito-page.js"></script>
</body>
</html>
