<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Semana 3 - Carga Dinámica</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Nuestro JavaScript (lógica) -->
    <script src="script.js"></script>
</head>
<body onload="cargarProductos();" class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-header bg-success text-white">
                <h2 class="mb-0">Productos desde API</h2>
            </div>
            <div class="card-body">
                <!-- Spinner de carga -->
                <div id="spinnerCarga" class="text-center py-5">
                    <div class="spinner-border text-success" style="width: 3rem; height: 3rem;"></div>
                    <p class="mt-3">Cargando productos...</p>
                </div>

                <!-- Contenido que se muestra después de cargar -->
                <div id="contenidoCargado" class="d-none">
                    <div class="alert alert-info">
                        <strong>Datos simulados</strong> desde una API externa.
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <label for="cmbProducto" class="form-label fw-bold">Productos</label>
                            <select id="cmbProducto" class="form-select">
                                <option value="">-- Cargando... --</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-3">
                        <span class="badge bg-info">Carga automática</span>
                        <span class="badge bg-secondary">Total: 4 productos</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
