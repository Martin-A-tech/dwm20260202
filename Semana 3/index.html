<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Semana 3 - Agregar Productos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS (para componentes como modales) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Nuestro JavaScript (lógica) -->
    <script src="script.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">Agregar Nuevo Producto</h2>
            </div>
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="txtId" class="form-label fw-bold">ID</label>
                        <input id="txtId" type="text" class="form-control" placeholder="Ej: 001" autofocus>
                    </div>
                    <div class="col-md-4">
                        <label for="txtNombre" class="form-label fw-bold">Nombre</label>
                        <input id="txtNombre" type="text" class="form-control" placeholder="Ej: Martillo">
                    </div>
                    <div class="col-md-2">
                        <button id="btnAgregar" type="button" class="btn btn-success w-100" onclick="agregarProducto();">
                            <span id="spinnerAgregar" class="spinner-border spinner-border-sm d-none"></span>
                            <span id="btnText">Agregar</span>
                        </button>
                    </div>
                </div>
                <hr>
                <div class="mt-3">
                    <label class="form-label fw-bold">Productos Agregados</label>
                    <select id="cmbProducto" class="form-select">
                        <option value="">-- No hay productos --</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
